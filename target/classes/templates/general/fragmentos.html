<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

    <!-- Fragmento 1: head de todas las páginas -->
    <head th:fragment="head">
        <title>Off Road Parts 4x4</title>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1"/>
        <link th:href="@{/webjars/bootstrap/css/bootstrap.min.css}" rel="stylesheet"/>
        <link th:href="@{/webjars/font-awesome/css/all.css}" rel="stylesheet"/>
        <script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
    </head>

    <!-- Fragmento 2: header (menú) de todas las páginas -->
    <header th:fragment="header">
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container">
                <a class="navbar-brand" th:href="@{/}">
                    <i class="fa-solid fa-truck-monster"></i> Off Road Parts 4x4
                </a>
                <button class="navbar-toggler" type="button"
                        data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="menuPrincipal">
                    <ul class="navbar-nav me-auto">
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/catalogo}">Catálogo</a>
                        </li>
                        <li class="nav-item" sec:authorize="hasRole('CLIENTE')">
                            <a class="nav-link" th:href="@{/carrito}">Carrito</a>
                        </li>
                        <li class="nav-item" sec:authorize="hasRole('CLIENTE')">
                            <a class="nav-link" th:href="@{/pedidos/historial}">Mis pedidos</a>
                        </li>
                        <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                            <a class="nav-link" th:href="@{/admin}">Administración</a>
                        </li>
                    </ul>
                    <ul class="navbar-nav">
                        <li class="nav-item" sec:authorize="!isAuthenticated()">
                            <a class="nav-link" th:href="@{/login}">Iniciar sesión</a>
                        </li>
                        <li class="nav-item" sec:authorize="!isAuthenticated()">
                            <a class="nav-link" th:href="@{/registro}">Registrarse</a>
                        </li>
                        <li class="nav-item" sec:authorize="isAuthenticated()">
                            <form th:action="@{/logout}" method="post">
                                <button class="btn btn-outline-light btn-sm mt-1">Cerrar sesión</button>
                            </form>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <!-- Fragmento 3: footer de todas las páginas -->
    <footer th:fragment="footer" class="bg-dark text-light text-center py-3 mt-5">
        <div class="container">
            <small>&copy; 2026 Off Road Parts 4x4 - Repuestos y accesorios para vehículos 4x4</small>
        </div>
    </footer>

</html>
