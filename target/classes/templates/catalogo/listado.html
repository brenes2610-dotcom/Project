<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{general/fragmentos :: head}"></head>
<body>
    <header th:replace="~{general/fragmentos :: header}"></header>

    <section class="container mt-4">
        <h2 class="mb-3">Catálogo de repuestos</h2>

        <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

        <form th:action="@{/catalogo}" method="get" class="row g-2 align-items-end mb-4">
            <div class="col-md-3">
                <label class="form-label">Categoría</label>
                <select name="categoria" class="form-select">
                    <option value="">Todas</option>
                    <option th:each="c : ${categorias}" th:value="${c.id}"
                            th:text="${c.nombre}" th:selected="${c.id == categoriaSel}"></option>
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label">Marca del vehículo</label>
                <select name="marca" class="form-select">
                    <option value="">Todas</option>
                    <option th:each="m : ${marcas}" th:value="${m.id}"
                            th:text="${m.nombre}" th:selected="${m.id == marcaSel}"></option>
                </select>
            </div>
            <div class="col-md-2">
                <label class="form-label">Precio mínimo</label>
                <input type="number" name="precioMin" min="0" step="0.01"
                       class="form-control" th:value="${precioMin}">
            </div>
            <div class="col-md-2">
                <label class="form-label">Precio máximo</label>
                <input type="number" name="precioMax" min="0" step="0.01"
                       class="form-control" th:value="${precioMax}">
            </div>
            <div class="col-md-2 d-flex gap-2">
                <button type="submit" class="btn btn-primary w-100">Filtrar</button>
                <a th:href="@{/catalogo}" class="btn btn-outline-secondary w-100">Limpiar</a>
            </div>
        </form>

        <div class="alert alert-info" th:if="${#lists.isEmpty(repuestos)}">
            No se encontraron repuestos con los filtros seleccionados. Probá con otros criterios.
        </div>

        <div class="row g-4" th:unless="${#lists.isEmpty(repuestos)}">
            <div class="col-sm-6 col-lg-4 col-xl-3" th:each="r : ${repuestos}">
                <div class="card h-100 shadow-sm">
                    <div class="position-relative bg-light d-flex align-items-center justify-content-center"
                         style="height:180px;">
                        <i class="fa-solid fa-image fa-3x text-secondary"></i>
                        <img th:if="${!#strings.isEmpty(r.imagenUrl)}" th:src="${r.imagenUrl}"
                             th:alt="${r.nombre}"
                             class="position-absolute top-0 start-0 w-100 h-100 object-fit-cover"
                             onerror="this.style.display='none'">
                        <span class="badge text-bg-danger position-absolute top-0 end-0 m-2"
                              th:if="${r.stock == 0}">Agotado</span>
                    </div>
                    <div class="card-body d-flex flex-column">
                        <small class="text-muted"
                               th:text="${r.categoria.nombre + ' · ' + r.marca.nombre}"></small>
                        <h5 class="card-title" th:text="${r.nombre}"></h5>
                        <p class="fw-bold fs-5 mt-auto mb-2"
                           th:text="${'₡' + #numbers.formatDecimal(r.precio, 1, 'COMMA', 2, 'POINT')}"></p>
                        <a class="btn btn-primary"
                           th:href="@{/catalogo/repuesto/{id}(id=${r.id})}">Ver detalle</a>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer th:replace="~{general/fragmentos :: footer}"></footer>
</body>
</html>
