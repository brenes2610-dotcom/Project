<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{general/fragmentos :: head}"></head>
<body>
    <header th:replace="~{general/fragmentos :: header}"></header>

    <section class="container mt-5" style="max-width:420px">
        <h2>Crear cuenta</h2>
        <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
        <form th:action="@{/registro}" th:object="${usuario}" method="post">
            <div class="mb-3">
                <label class="form-label">Nombre</label>
                <input type="text" th:field="*{nombre}" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Correo electrónico</label>
                <input type="email" th:field="*{correo}" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Teléfono</label>
                <input type="text" th:field="*{telefono}" class="form-control">
            </div>
            <div class="mb-3">
                <label class="form-label">Contraseña</label>
                <input type="password" th:field="*{password}" class="form-control" required>
            </div>
            <button class="btn btn-primary w-100">Registrarme</button>
        </form>
        <p class="mt-3">¿Ya tienes cuenta? <a th:href="@{/login}">Inicia sesión</a></p>
    </section>

    <footer th:replace="~{general/fragmentos :: footer}"></footer>
</body>
</html>
