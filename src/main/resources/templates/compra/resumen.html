<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{general/fragmentos :: head}"></head>
<body>
    <header th:replace="~{general/fragmentos :: header}"></header>

    <section class="container mt-4">
        <div class="alert alert-success" th:if="${todoOk}" th:text="${todoOk}"></div>

        <h2>Pedido #<span th:text="${pedido.id}"></span></h2>
        <p class="text-muted">
            Fecha: <span th:text="${#temporals.format(pedido.fecha, 'dd/MM/yyyy HH:mm')}"></span>
            &middot; Estado: <span class="badge text-bg-warning" th:text="${pedido.estado}"></span>
        </p>

        <p class="mb-1"><strong>Dirección de entrega:</strong> <span th:text="${pedido.direccionEntrega}"></span></p>
        <p><strong>Método de pago:</strong> <span th:text="${pedido.metodoPago}"></span></p>

        <table class="table align-middle">
            <thead>
                <tr>
                    <th>Repuesto</th>
                    <th>Precio</th>
                    <th>Cant.</th>
                    <th class="text-end">Subtotal</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="d : ${pedido.detalles}">
                    <td th:text="${d.producto.nombre}"></td>
                    <td th:text="${'₡' + #numbers.formatDecimal(d.precioUnitario, 1, 'COMMA', 2, 'POINT')}"></td>
                    <td th:text="${d.cantidad}"></td>
                    <td class="text-end"
                        th:text="${'₡' + #numbers.formatDecimal(d.subtotal, 1, 'COMMA', 2, 'POINT')}"></td>
                </tr>
            </tbody>
            <tfoot>
                <tr>
                    <th colspan="3" class="text-end">Total</th>
                    <th class="text-end fs-5"
                        th:text="${'₡' + #numbers.formatDecimal(pedido.total, 1, 'COMMA', 2, 'POINT')}"></th>
                </tr>
            </tfoot>
        </table>

        <a th:href="@{/catalogo}" class="btn btn-primary">Seguir comprando</a>
    </section>

    <footer th:replace="~{general/fragmentos :: footer}"></footer>
</body>
</html>
