<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{general/fragmentos :: head}"></head>

<body>

<header th:replace="~{general/fragmentos :: header}"></header>

<section class="container mt-4">

    <h2 class="mb-3">Gestión de pedidos</h2>

    <p class="text-muted">
        Consulte los pedidos registrados,
        aplique filtros y actualice sus estados.
    </p>

    <div class="alert alert-success"
         th:if="${mensaje}"
         th:text="${mensaje}">
    </div>

    <div class="alert alert-danger"
         th:if="${error}"
         th:text="${error}">
    </div>

    <!-- Filtros -->
    <form th:action="@{/admin/pedidos}"
          method="get"
          class="row g-3 mb-4">

        <div class="col-md-3">
            <label class="form-label">Estado</label>

            <select name="estado" class="form-select">
                <option value="">Todos</option>

                <option value="PENDIENTE"
                        th:selected="${estadoSeleccionado == 'PENDIENTE'}">
                    Pendiente
                </option>

                <option value="EN_PREPARACION"
                        th:selected="${estadoSeleccionado == 'EN_PREPARACION'}">
                    En preparación
                </option>

                <option value="ENVIADO"
                        th:selected="${estadoSeleccionado == 'ENVIADO'}">
                    Enviado
                </option>

                <option value="ENTREGADO"
                        th:selected="${estadoSeleccionado == 'ENTREGADO'}">
                    Entregado
                </option>

                <option value="CANCELADO"
                        th:selected="${estadoSeleccionado == 'CANCELADO'}">
                    Cancelado
                </option>
            </select>
        </div>

        <div class="col-md-3">
            <label class="form-label">Fecha inicial</label>

            <input type="date"
                   name="fechaInicio"
                   class="form-control"
                   th:value="${fechaInicio}">
        </div>

        <div class="col-md-3">
            <label class="form-label">Fecha final</label>

            <input type="date"
                   name="fechaFin"
                   class="form-control"
                   th:value="${fechaFin}">
        </div>

        <div class="col-md-3 d-flex align-items-end gap-2">

            <button type="submit"
                    class="btn btn-primary">
                Filtrar
            </button>

            <a th:href="@{/admin/pedidos}"
               class="btn btn-secondary">
                Limpiar
            </a>

        </div>

    </form>

    <!-- Listado de pedidos -->
    <div class="table-responsive">

        <table class="table table-striped align-middle">

            <thead>
                <tr>
                    <th>Pedido</th>
                    <th>Cliente</th>
                    <th>Fecha</th>
                    <th>Total</th>
                    <th>Estado actual</th>
                    <th>Actualizar estado</th>
                </tr>
            </thead>

            <tbody>

                <tr th:each="pedido : ${pedidos}">

                    <td th:text="${'#' + pedido.id}"></td>

                    <td th:text="${pedido.usuario.nombre}"></td>

                    <td th:text="${pedido.fecha}"></td>

                    <td th:text="${'₡' + pedido.total}"></td>

                    <td>
                        <span class="badge bg-warning text-dark"
                              th:if="${pedido.estado == 'PENDIENTE'}">
                            Pendiente
                        </span>

                        <span class="badge bg-info text-dark"
                              th:if="${pedido.estado == 'EN_PREPARACION'}">
                            En preparación
                        </span>

                        <span class="badge bg-primary"
                              th:if="${pedido.estado == 'ENVIADO'}">
                            Enviado
                        </span>

                        <span class="badge bg-success"
                              th:if="${pedido.estado == 'ENTREGADO'}">
                            Entregado
                        </span>

                        <span class="badge bg-danger"
                              th:if="${pedido.estado == 'CANCELADO'}">
                            Cancelado
                        </span>
                    </td>

                    <td>

                        <form th:action="@{/admin/pedidos/estado/{id}(id=${pedido.id})}"
                              method="post"
                              class="d-flex gap-2">

                            <select name="estado"
                                    class="form-select form-select-sm"
                                    required>

                                <option value="PENDIENTE"
                                        th:selected="${pedido.estado == 'PENDIENTE'}">
                                    Pendiente
                                </option>

                                <option value="EN_PREPARACION"
                                        th:selected="${pedido.estado == 'EN_PREPARACION'}">
                                    En preparación
                                </option>

                                <option value="ENVIADO"
                                        th:selected="${pedido.estado == 'ENVIADO'}">
                                    Enviado
                                </option>

                                <option value="ENTREGADO"
                                        th:selected="${pedido.estado == 'ENTREGADO'}">
                                    Entregado
                                </option>

                                <option value="CANCELADO"
                                        th:selected="${pedido.estado == 'CANCELADO'}">
                                    Cancelado
                                </option>

                            </select>

                            <button type="submit"
                                    class="btn btn-primary btn-sm">
                                Guardar
                            </button>

                        </form>

                    </td>

                </tr>

            </tbody>

        </table>

    </div>

    <div class="alert alert-info"
         th:if="${#lists.isEmpty(pedidos)}">
        No se encontraron pedidos con los filtros seleccionados.
    </div>

    <a th:href="@{/admin}"
       class="btn btn-secondary mb-4">
        Volver a administración
    </a>

</section>

<footer th:replace="~{general/fragmentos :: footer}"></footer>

</body>
</html>
