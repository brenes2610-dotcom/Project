
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{general/fragmentos :: head}"></head>

<body>

    <header th:replace="~{general/fragmentos :: header}"></header>

    <section class="container mt-4">

        <div class="d-flex justify-content-between
                    align-items-center mb-3">

            <h2>Gestión de repuestos</h2>

            <a th:href="@{/admin/productos/nuevo}"
               class="btn btn-primary">
                Agregar repuesto
            </a>

        </div>

        <div class="alert alert-success"
             th:if="${mensaje}"
             th:text="${mensaje}">
        </div>

        <div class="alert alert-danger"
             th:if="${error}"
             th:text="${error}">
        </div>

        <div class="alert alert-info"
             th:if="${#lists.isEmpty(productos)}">
            No hay repuestos registrados.
        </div>

        <div class="table-responsive"
             th:unless="${#lists.isEmpty(productos)}">

            <table class="table table-striped align-middle">

                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Repuesto</th>
                        <th>Categoría</th>
                        <th>Marca</th>
                        <th>Precio</th>
                        <th>Stock</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>

                <tbody>

                    <tr th:each="producto : ${productos}">

                        <td th:text="${producto.codigo}"></td>

                        <td th:text="${producto.nombre}"></td>

                        <td th:text="${producto.categoria.nombre}"></td>

                        <td th:text="${producto.marca.nombre}"></td>

                        <td th:text="${'₡' + #numbers.formatDecimal(
                            producto.precio, 1, 'COMMA', 2, 'POINT')}">
                        </td>

                        <td th:text="${producto.stock}"></td>

                        <td>
                            <span class="badge text-bg-success"
                                  th:if="${producto.activo}">
                                Activo
                            </span>

                            <span class="badge text-bg-secondary"
                                  th:unless="${producto.activo}">
                                Inactivo
                            </span>
                        </td>

                        <td>
                            <a class="btn btn-primary btn-sm"
                               th:href="@{/admin/productos/editar/{id}
                               (id=${producto.id})}">
                                Editar
                            </a>

                            <form th:if="${producto.activo}"
                                  th:action="@{/admin/productos/desactivar/{id}
                                  (id=${producto.id})}"
                                  method="post"
                                  class="d-inline">

                                <button type="submit"
                                        class="btn btn-danger btn-sm">
                                    Desactivar
                                </button>
                                </form>
  
<form th:unless="${producto.activo}"
      th:action="@{/admin/productos/activar/{id}(id=${producto.id})}"
      method="post"
      class="d-inline">

    <button type="submit"
            class="btn btn-success btn-sm">
        Activar
    </button>

</form>

                            
                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

        <a th:href="@{/admin}"
           class="btn btn-secondary mt-3">
            Volver al panel
        </a>

    </section>

    <footer th:replace="~{general/fragmentos :: footer}"></footer>

</body>
</html>
