<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{general/fragmentos :: head}"></head>

<body>

<header th:replace="~{general/fragmentos :: header}"></header>

<section class="container mt-4">

    <h2 class="mb-3">Historial de movimientos</h2>

    <p class="text-muted">
        Consulte las entradas y ajustes realizados
        en el inventario de repuestos.
    </p>

    <a class="btn btn-secondary mb-3"
       th:href="@{/inventario}">
        Volver al inventario
    </a>

    <div class="table-responsive">

        <table class="table table-striped align-middle">

            <thead>
                <tr>
                    <th>Fecha</th>
                    <th>Código</th>
                    <th>Repuesto</th>
                    <th>Tipo</th>
                    <th>Cantidad</th>
                    <th>Stock anterior</th>
                    <th>Stock nuevo</th>
                    <th>Responsable</th>
                </tr>
            </thead>

            <tbody>

                <tr th:each="movimiento : ${movimientos}">

                    <td th:text="${movimiento.fecha}"></td>

                    <td th:text="${movimiento.producto.codigo}"></td>

                    <td th:text="${movimiento.producto.nombre}"></td>

                    <td>
                        <span class="badge bg-success"
                              th:if="${movimiento.tipo == 'ENTRADA'}">
                            Entrada
                        </span>

                        <span class="badge bg-primary"
                              th:if="${movimiento.tipo == 'AJUSTE'}">
                            Ajuste
                        </span>
                    </td>

                    <td th:text="${movimiento.cantidad}"></td>

                    <td th:text="${movimiento.stockAnterior}"></td>

                    <td th:text="${movimiento.stockNuevo}"></td>

                    <td th:text="${movimiento.usuario.nombre}"></td>

                </tr>

            </tbody>

        </table>

    </div>

    <div class="alert alert-info"
         th:if="${#lists.isEmpty(movimientos)}">
        Todavía no hay movimientos de inventario registrados.
    </div>

</section>

<footer th:replace="~{general/fragmentos :: footer}"></footer>

</body>
</html>
