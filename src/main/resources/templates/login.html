<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{general/fragmentos :: head}"></head>
<body>
    <header th:replace="~{general/fragmentos :: header}"></header>

    <section class="container mt-5" style="max-width:420px">
        <h2>Iniciar sesión</h2>
        <div class="alert alert-danger" th:if="${param.error}">Correo o contraseña incorrectos</div>
        <div class="alert alert-success" th:if="${param.registrado}">Cuenta creada, ya puedes iniciar sesión</div>
        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label class="form-label">Correo electrónico</label>
                <input type="email" name="correo" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Contraseña</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button class="btn btn-primary w-100">Iniciar sesión</button>
        </form>
        <p class="mt-3">¿No tienes cuenta? <a th:href="@{/registro}">Regístrate</a></p>
    </section>

    <footer th:replace="~{general/fragmentos :: footer}"></footer>
</body>
</html>
